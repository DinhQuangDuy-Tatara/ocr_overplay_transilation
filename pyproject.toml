[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-overlay-mvp"
version = "0.2.0"
description = "Real-Time Screen Translator for Linux Wayland"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0", "PySide6>=6.7", "numpy>=1.26"]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7,<3", "paddlepaddle>=2.6"]
vision = ["opencv-python>=4.8"]
dev = ["pytest>=8.0"]

[project.scripts]
ocr-overlay = "ocr_overlay.__main__:main"
rtst = "ocr_overlay.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
